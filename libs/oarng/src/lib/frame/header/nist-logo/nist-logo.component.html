<div class="nist-brand flex items-center">
    <!-- NIST logo -->
    <div class="image-container">
        <a href="https://www.nist.gov" target="_blank" title="National Institute of Standards and Technology" rel="home">
            <img
                src="assets/images/f_nist-logo-brand-white_nist-logo-brand-white.png"
                alt="NIST"
                class="scaled-image"
            />
        </a>
    </div>

    <!-- Two-line title -->
    <div class="title-container">
        <div class="logo-text">
            {{ titleLn1 }}
        </div>

        <div class="logo-text">
            {{ titleLn2 }}
        </div>
    </div>

    <!-- Version -->
    <span class="version">
        {{ appVersion }}
    </span>
</div>
