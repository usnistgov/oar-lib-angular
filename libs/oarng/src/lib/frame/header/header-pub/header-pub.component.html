<div class="header-container">

    <!-- LEFT -->
    <div class="header-left">
        <lib-nist-logo
            [titleLn1]="title_line01"
            [titleLn2]="title_line02"
            [appVersion]="appVersion">
        </lib-nist-logo>
    </div>

    <!-- RIGHT -->
    <div class="bar-right-pub">

        <!-- Desktop Home -->
        <fa-icon
            class="home-icon"
            *ngIf="homeButtonLink"
            [icon]="faHouse"
            transform="shrink-5"
            (click)="goHome()"
            aria-hidden="true">
        </fa-icon>

        <!-- Hamburger -->
        <button
            type="button"
            class="mobile-menu-button"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="mobileMenuOpen"
            aria-label="Toggle navigation menu"
        >
            <fa-icon
                [icon]="mobileMenuOpen ? faXmark : faBars">
            </fa-icon>
        </button>

        <!-- Projected menu -->
        <div
            class="customNavbar"
            [class.mobile-open]="mobileMenuOpen"
        >
            <ng-content select=".custom-navbar"></ng-content>
        </div>

    </div>
</div>
