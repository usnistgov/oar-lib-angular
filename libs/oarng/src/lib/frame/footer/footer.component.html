<div id="footer" >
    <div class="footer__inner">
        <!-- Social Media list -->
        <div class="social-links" *ngIf="socialMediaList">
            <div class="item-list">
                <ul>
                    <li *ngFor="let socialMedia of socialMediaList; let i = index">
                        <a [href]="socialMedia.url" 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            class="social-btn social-btn--large extlink ext">

                            <fa-icon 
                                [icon]="[socialMedia.prefix, socialMedia.icon]" 
                                [class]="socialMedia.icon"
                                class="social-icon"
                                [style.--hover-bg-color]="socialMedia.hover">
                                <span class="element-invisible">{{socialMedia.name}}</span>
                            </fa-icon>

                            <span class="ext">
                                <span class="element-invisible"> 
                                    (link is external)
                                </span>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Footer logo -->
        <div class="footer__logo">
            <a href="https://www.nist.gov" target="_blank" title="National Institute of Standards and Technology" class="footer__logo-link" rel="home">
                <img id="logo" src="./assets/images/f_nist-logo-brand-white_nist-logo-brand-white.png" alt="National Institute of Standards and Technology" title="National Institute of Standards and Technology">
            </a>
        </div>
    </div>

    <div class="footerlinks">
        <div class="footerlinks-content">
            <div class="spaceholder">
            </div>
            <div class="footerlinks">
                <span *ngFor="let link of footerLinks01; let i = index">
                    <a [href]="link.url">{{ link.title }}</a>
                    <span *ngIf="i < footerLinks01.length - 1" class="separator">|</span>
                </span>
            </div>


            <div class="ctslogo">
                <a href="https://www.coretrustseal.org/" target="_blank" rel="noopener noreferrer" title="CoreTrustSeal">
                    <img src="assets/images/core-trust-seal-logo.png" alt="CoreTrustSeal logo">
                </a>
            </div>
        </div>
    </div>
</div>
